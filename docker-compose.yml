services:
  postgres:
    image: postgres:16-alpine
    container_name: tpc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tpc_branch_head_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tpc_branch_head_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional pgAdmin for GUI DB exploration
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tpc_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@theprimeclasses.com
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
